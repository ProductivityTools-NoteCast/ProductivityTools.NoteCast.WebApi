apiVersion: apps/v1
kind: Deployment
metadata:
  name: notecast-webapi
  labels:
    app: notecast-webapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notecast-webapi
  template:
    metadata:
      labels:
        app: notecast-webapi
    spec:
      containers:
        - name: notecast-webapi
          image: us-central1-docker.pkg.dev/pwujczyk-pt/pt-notecast/notecast-webapi:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: notecast-webapi
spec:
  type: LoadBalancer
  selector:
    app: notecast-webapi
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
