name: Build and Deploy to GKE

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: pwujczyk-pt
  GKE_CLUSTER: pt-notecast
  GKE_ZONE: us-central1
  GAR_LOCATION: us-central1
  REPOSITORY: notecast
  IMAGE_NAME: notecast-webapi
  DEPLOYMENT_NAME: notecast-webapi
  SERVICE_ACCOUNT: github-actions-notecast@pwujczyk-pt.iam.gserviceaccount.com
  # Po wykonaniu skryptu konfiguracyjnego WIF wklej tutaj lub do sekretu WIF_PROVIDER pełną nazwę providera:
  # np. projects/123456789012/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}

jobs:
  build-and-deploy:
    name: Build, Push & Deploy to GKE
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker image
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to GKE
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} ${{ env.DEPLOYMENT_NAME }}="$IMAGE_URI"
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} --timeout=180s
